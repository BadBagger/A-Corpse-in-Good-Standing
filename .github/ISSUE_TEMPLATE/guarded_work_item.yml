name: Guarded Work Item
description: Use for implementation work that must preserve project rule locks.
title: "<area>: <change>"
labels:
  - implementation
body:
  - type: checkboxes
    id: invariants
    attributes:
      label: Invariants
      options:
        - label: Preserve the accepted Confession Duel/Litany format.
        - label: Do not add a second confession-spend UI.
        - label: Do not add a real-time nine-day countdown.
        - label: Do not let Act III memory decay remove functional items or block solved paths.
        - label: Do not make Act II/III confessions acquirable from Act I scenes.
        - label: Keep Grey Float hard-R and compliant.
        - label: Do not start final paintovers while Step 5 human review is pending.
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the intended change and the exact files or rooms involved.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      value: |
        - [ ] `powershell -NoProfile -ExecutionPolicy Bypass -File tools\Run-RepoReadinessGates.ps1`
        - [ ] `powershell -NoProfile -ExecutionPolicy Bypass -File tools\Run-Step1Gates.ps1`
        - [ ] Step-specific gate:
